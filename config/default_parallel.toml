# Configuración de EJEMPLO del ejecutor paralelo (Bloque 5.2; MASTER_SPEC §56-61, CFG-011).
#
# Fichero independiente de ``default_engine.toml``: son ajustes de EJECUCIÓN (no matemáticos) y no
# deben entrar en el ``ConfigHash`` del motor ni en las claves de caché. Como en el resto de la
# configuración, no hay valores por defecto en el código: toda clave obligatoria debe estar presente
# y las opcionales omitidas valen "no configurado".
#
# Los valores de este fichero son un EJEMPLO para desarrollo y pruebas. NO son una recomendación de
# producción: el dimensionamiento de workers y de memoria en el servidor (reserva para SQL Server y
# otros servicios) se decide tras benchmarks controlados (decisión diferida D-11).

[parallel]
# Número de procesos worker. Nunca se deduce de ``os.cpu_count()`` (PAR-012).
workers = 2
# Carteras por lote. Si se omite, se usa el modo AUTO (PAR-003):
#   ceil(n_carteras / (workers * auto_batches_per_worker)), acotado a [1, max_batch_size].
# batch_size = 5
auto_batches_per_worker = 4
max_batch_size = 50
# Lotes simultáneamente en vuelo por worker (contrapresión; cola acotada).
max_in_flight_batches_per_worker = 2
# Método de arranque de procesos: SPAWN o FORKSERVER (solo Linux/Unix).
# SPAWN está probado únicamente en Windows (B5.2). FORKSERVER NO ESTÁ VALIDADO: no se ha ejecutado
# ninguna prueba en Linux; no se declara compatibilidad hasta ejecutarlas.
# ``fork`` no se admite: es inseguro con librerías con hilos (BLAS, solvers).
start_method = "SPAWN"
# Hilos numéricos (BLAS/OpenMP) por worker. Línea base: 1 (MASTER_SPEC §60).
blas_threads = 1
# Reciclado preventivo de un worker tras N lotes. Omitido = sin reciclado.
# max_tasks_per_child = 100
# Entrega de los datos de mercado a los workers (B5.3, PAR-004):
#   BUNDLE_FILE   - fichero de arranque deserializado por cada worker (modo B5.2; reserva).
#   FILE_MMAP     - arrays en un fichero proyectado en memoria de solo lectura (mmap).
#   SHARED_MEMORY - arrays en un segmento multiprocessing.shared_memory.
# El valor por defecto se mantiene en BUNDLE_FILE hasta que el benchmark E4 justifique otro
# (benchmarks/results/shared_data_cache_*.json); véase BLOCK_5_3_EXECUTION_BRIEF.md.
shared_data_mode = "BUNDLE_FILE"

# Caché de resultados por worker (CCH-001…005). DESACTIVADA por defecto: es la vía de rollback.
[parallel.cache]
enabled = false
max_entries = 64
max_bytes = 67108864

# Supervisión, reintentos, plazos y diario local (B5.4; P-03…P-06). EJEMPLO de desarrollo, sin
# calibrar para producción (los plazos reales dependen del tamaño del problema; véase D-11).
[parallel.recovery]
# Intentos aislados que se conceden a una tarea sospechosa de una caída antes de ``WORKER_CRASHED``.
max_task_attempts = 2
# Caídas consecutivas sin atribuir a ninguna tarea, y tareas venenosas consecutivas sin ningún
# resultado en medio, antes de abortar la ejecución.
max_rebuilds_without_progress = 3
# Cota absoluta de reconstrucciones por ejecución.
max_total_rebuilds = 50
# Periodo del sondeo del supervisor (segundos).
supervision_poll_seconds = 0.5
# Plazo de pared por cartera / por lote, en segundos. Omitidos = sin plazo.
# task_timeout_seconds = 600.0
# batch_timeout_seconds = 3600.0
# Espera a los lotes en vuelo tras una cancelación antes de terminar sus workers.
cancel_grace_seconds = 5.0
# El diario solo se escribe si está habilitado Y se pasa un directorio explícito a ``run``.
journal_enabled = false
# Longitud máxima de los mensajes de error registrados (observabilidad acotada).
max_message_chars = 500
