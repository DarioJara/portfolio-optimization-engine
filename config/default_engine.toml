# Configuración de EJEMPLO del motor (MASTER_SPEC §4).
#
# Es la única ubicación de los valores por defecto: el código no contiene defaults de negocio.
# Toda clave obligatoria debe estar presente; las claves opcionales omitidas valen "no configurado".
# Para producción, copiar y revisar cada valor explícitamente.

[engine]
# OptimizationHorizonYears (enmienda E-03): horizonte sobre el que se comparan expected
# returns, costes de transacción y métricas netas.
optimization_horizon_years = 1.0
random_seed = 20260923

[data]
min_return_observations = 60
max_stale_run = 5
stale_price_severity = "WARNING"
outlier_method = "ROBUST_ZSCORE"
outlier_threshold = 10.0
outlier_severity = "WARNING"
max_calendar_gap_days = 7
calendar_gap_severity = "WARNING"
asset_error_policy = "FAIL"
weight_sum_tolerance = 1e-6
residual_weight_policy = "ERROR"
# cash_asset_id: solo con residual_weight_policy = "ASSIGN_TO_CASH".

[returns]
return_kind = "ARITHMETIC"
# log_return_justification: obligatoria solo con return_kind = "LOG".
trading_days_per_year = 252
risk_free_rate = 0.02
expected_return_mode = "INTERNAL_ESTIMATION"
internal_estimation_method = "HISTORICAL_MEAN"

[risk]
covariance_method = "LEDOIT_WOLF"
empirical_ddof = 1
symmetry_tolerance = 1e-8
psd_tolerance = 1e-10
repair_method = "EIGENVALUE_FLOOR"
eigenvalue_floor_relative = 1e-10
# condition_number_limit: opcional; si se define, repara matrices mal condicionadas.

[constraints]
long_only = true
# global_min_weight / global_max_weight: opcionales.
# Política para activos restringidos ya en cartera (E-09). Valor de ejemplo exigido: HOLD_OR_REDUCE.
restricted_existing_position_policy = "HOLD_OR_REDUCE"
# global_max_turnover: opcional; PortfolioSpec.max_turnover prevalece sobre este valor.
# Límites de peso agregado por grupo (Bloque 2). Ejemplo, sin activar:
# [[constraints.group_limits]]
# dimension = "SECTOR"      # SECTOR | COUNTRY | ASSET_CLASS | CURRENCY
# group = "Tech"
# min_weight = 0.0          # opcional (al menos uno de min_weight / max_weight)
# max_weight = 0.6
group_limits = []

[transaction_costs]
input_unit = "BPS"
source_precedence = ["BUY_SELL", "ESTIMATED", "BID_ASK_SPREAD"]
spread_commission = 0.0
max_unit_cost = 0.05

[frontier]
# Puntos totales de la frontera (incluye los extremos MinVariance y MaxReturn), MASTER_SPEC §41.
frontier_points = 20
# Frontera adaptativa (§42): con adaptive = true se exigen initial_frontier_points (< frontier_points)
# y adaptive_gap_tolerance; con adaptive = false no deben declararse.
adaptive = false
# theta (§35): AUTO calibra el rango desde los extremos (A-16); EXPLICIT exige theta_min y theta_max.
theta_grid_mode = "AUTO"
theta_scale = "LOG"
theta_auto_min_multiplier = 0.05
theta_auto_max_multiplier = 5.0
dedup_weight_tolerance = 1e-6
dedup_return_tolerance = 1e-8
dedup_volatility_tolerance = 1e-8
pareto_tolerance = 1e-10
zero_weight_tolerance = 1e-8
zero_volatility_tolerance = 1e-12
# min_holding_weight: opcional (A-08); exige tenencia estrictamente positiva en la composición.

[solver]
eps_abs = 1e-9
eps_rel = 1e-9
max_iterations = 50000
# time_limit_seconds: opcional.
polish = true
# Intervalo fijo de rho adaptativo: garantiza resultados reproducibles (no dependen del reloj).
adaptive_rho_interval = 25
warm_start = true
workspace_reuse = true
ambiguous_status_policy = "COLD_RETRY"
retry_iteration_multiplier = 4
accept_inaccurate_solutions = false
# Tolerancias del SolutionValidator (VAL-008).
budget_tolerance = 1e-7
bound_tolerance = 1e-7
constraint_tolerance = 1e-7
variance_tolerance = 1e-12
# LP de MaximumReturn (HiGHS vía SciPy): tolerancia primal/dual e iteraciones máximas.
lp_feasibility_tolerance = 1e-9
lp_max_iterations = 100000
# Etapa 2 de MaximumReturn (A-14): retorno >= R* - max(abs, rel * |R*|), en unidades de retorno.
max_return_tie_abs_tolerance = 1e-8
max_return_tie_rel_tolerance = 1e-7

[benchmark]
repetitions = 5
warmup_runs = 1
percentiles = [50.0, 95.0, 99.0]
