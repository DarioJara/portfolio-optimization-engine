name: Portfolio Engine CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-py311:
    name: Ubuntu / Python 3.11
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, tests and optional SCIP backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,exact-mip,bench]'
      - name: Static checks
        run: |
          python -m mypy --strict portfolio_engine
          python -m ruff check .
          python -m ruff format --check .
      - name: Linux forkserver smoke test
        run: python -m pytest -q tests/integration/test_forkserver_linux.py
      - name: B5.4 Linux recovery evidence (forkserver, flock, permissions, zombies, cleanup)
        # Evidencia verificable (AUDIT_BLOCK_5_4 L-3): una sola anotación con el resultado de cada
        # prueba (GitHub limita a 10 anotaciones por tipo y paso) más el entorno del runner. El
        # resultado de pytest decide el paso.
        shell: bash
        run: |
          set +e
          python -m pytest -v -rA -p no:cacheprovider tests/integration/test_recovery_linux.py tests/unit/parallel/test_markers.py tests/unit/parallel/test_journal.py tests/integration/test_forkserver_linux.py 2>&1 | tee b54-linux.txt
          status=${PIPESTATUS[0]}
          env_line="$(uname -sr) | $(python --version) | uid=$(id -u) | $(lscpu | grep 'Model name' | sed 's/  */ /g')"
          not_passed="$(grep -E '^(FAILED|ERROR|SKIPPED) ' b54-linux.txt | cut -c1-200 | paste -sd ';' | cut -c1-3900)"
          failures="$(grep -E '^E ' b54-linux.txt | cut -c1-160 | head -n 25 | paste -sd '|' | cut -c1-3900)"
          passed="$(grep -E '^PASSED ' b54-linux.txt | sed -e 's#PASSED tests/[a-z_]*/##' -e 's#parallel/##' | paste -sd ';')"
          passed_count="$(grep -cE '^PASSED ' b54-linux.txt)"
          echo "::notice title=b54-linux-env::${env_line}"
          echo "::notice title=b54-linux-summary::$(tail -n 1 b54-linux.txt)"
          echo "::notice title=b54-linux-passed-count::${passed_count}"
          echo "::notice title=b54-linux-not-passed::${not_passed}"
          echo "::warning title=b54-linux-failure-lines::${failures}"
          echo "::notice title=b54-linux-passed-1::$(echo "${passed}" | cut -c1-3900)"
          echo "::notice title=b54-linux-passed-2::$(echo "${passed}" | cut -c3901-7800)"
          exit $status
      - name: Runner CPU (diagnostic)
        run: echo "::notice title=runner-cpu::$(lscpu | grep 'Model name' | sed 's/  */ /g')"
      - name: Full test suite
        # El resultado de pytest decide el job; las anotaciones solo hacen visible qué tests fallan
        # y en qué CPU (diagnóstico de la fragilidad de B4 dependiente del runner, AUDIT_BLOCK_5_3 H-1).
        shell: bash
        run: |
          set +e
          python -m pytest -q -rfE 2>&1 | tee pytest-full.txt
          status=${PIPESTATUS[0]}
          echo "::notice title=pytest-summary::$(tail -n 1 pytest-full.txt)"
          grep -E '^(FAILED|ERROR)' pytest-full.txt | cut -c1-300 | while IFS= read -r line; do echo "::warning title=pytest-failed::$line"; done
          exit $status
      - name: B5.5 cross-platform diagnostic (C-28; does not gate)
        # Describe, sin decidir el resultado, en qué se diferencia el lote de referencia de Windows del de
        # esta plataforma (la prueba tests/integration/test_cross_platform_reference.py es la que decide).
        if: always()
        shell: bash
        run: |
          python benchmarks/scripts/cross_platform_reference.py explain 2>&1 | tee xplat.txt
          while IFS= read -r line; do echo "::notice title=b55-xplat::$line"; done < xplat.txt
          python benchmarks/scripts/baseline.py --show-work 2>&1 | tee work.txt
          while IFS= read -r line; do echo "::notice title=b55-work::$line"; done < work.txt
      - name: B5.5 Linux benchmark evidence (scale 10, spawn and forkserver)
        if: always()
        # Evidencia verificable (B5.5, BEN-004/007): 10 carteras sintéticas de ENG-MIX-BASE con
        # secuencial, spawn y forkserver, 1 y 2 workers. El script termina con error si alguna
        # ejecución difiere de la secuencial (T1), viola restricciones o pierde/duplica tareas.
        # Los tiempos son informativos (runner compartido); las anotaciones los hacen consultables.
        shell: bash
        run: |
          set +e
          mkdir -p benchmarks/results/ci
          python benchmarks/scripts/scaling.py --scales 10 --mix ENG-MIX-BASE --workers 1 2 \
            --methods sequential spawn forkserver --repetitions 2 --parallel-repetitions 2 \
            --startup-repetitions 2 --tag ci --out benchmarks/results/ci 2>&1 | tee scaling-ci.txt
          status=${PIPESTATUS[0]}
          python benchmarks/scripts/ci_summary.py scaling benchmarks/results/ci/scaling_*.json
          exit $status
      - name: B5.5 H-1 numerical probe (diagnostic, does not gate)
        if: always()
        # Reproduce el mecanismo de H-1 con perturbaciones de redondeo y lo anota junto al modelo de
        # CPU del runner. No cambia ningún algoritmo ni tolerancia; es solo diagnóstico.
        shell: bash
        run: |
          python benchmarks/scripts/h1_numerical_probe.py --repetitions 60 --out benchmarks/results/ci
          python benchmarks/scripts/ci_summary.py h1 benchmarks/results/ci/h1_numerical_probe_*.json
