name: B5.3 branch validation (Linux)

# Validación TEMPORAL de la rama del Bloque 5.3 en Ubuntu (suite completa, forkserver y benchmark
# pequeño con datos sintéticos). Se ejecuta solo al hacer push a la rama de B5.3 y se elimina antes
# de la integración en main (la CI permanente es ci.yml). No accede a SQL Server ni a datos reales.
# Los resultados se publican como anotaciones (legibles sin descargar artefactos) y como artefacto.
on:
  push:
    branches: [block5-shared-memory-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-py311:
    name: Ubuntu / Python 3.11 (B5.3)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package, tests, SCIP and benchmark extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,exact-mip,bench]'
      - name: Environment
        run: |
          echo "::notice title=env::$(python --version) | $(uname -sr) | cpus=$(nproc) | $(lscpu | grep 'Model name' | sed 's/  */ /g')"
          echo "::notice title=env-libs::$(python -m pip list 2>/dev/null | grep -i -E '^(numpy|scipy|osqp|clarabel|pyscipopt|threadpoolctl|psutil) ' | tr '\n' ';' | sed 's/  */ /g')"
      - name: Static checks
        run: |
          python -m mypy --strict portfolio_engine
          python -m ruff check .
          python -m ruff format --check .
      - name: Shared data and forkserver tests
        run: python -m pytest -q tests/integration/test_forkserver_linux.py tests/integration/test_shared_data_equivalence.py tests/unit/parallel/test_shared_data.py tests/unit/cache tests/unit/parallel/test_operation_cache.py
      - name: Full test suite
        shell: bash
        run: |
          set +e
          python -m pytest -q -rsf --durations=10 2>&1 | tee pytest-full.txt
          status=${PIPESTATUS[0]}
          echo "::notice title=pytest-linux::$(grep -E '^[0-9]+ (passed|failed)|passed|failed' pytest-full.txt | tail -n 1)"
          grep -E '^(SKIPPED|FAILED|ERROR)' pytest-full.txt | while IFS= read -r line; do echo "::warning title=pytest-detail::$line"; done
          grep -E '^E  ' pytest-full.txt | head -40 | while IFS= read -r line; do echo "::warning title=pytest-error::$line"; done
          exit $status
      - name: Local shared-data and cache benchmark (small, synthetic)
        shell: bash
        run: |
          set +e
          python benchmarks/scripts/shared_data_cache.py --universe 50 500 --workers 1 2 4 \
            --start-methods spawn forkserver --repetitions 2 --seed 7 --out bench-results 2>&1 | tee bench.txt
          status=${PIPESTATUS[0]}
          # Un único aviso multilínea con las celdas (los avisos por línea se recortan a 10 por paso)
          cells=$(grep -E '^N= ' bench.txt | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=bench-cells::$cells"
          echo "::notice title=bench-tracker-errors::resource_tracker KeyError lines: $(grep -c 'KeyError' bench.txt)"
          grep -v -E '^N= ' bench.txt | tail -n 12 | while IFS= read -r line; do echo "::notice title=bench-tail::$line"; done
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: shared-data-cache-benchmark-linux
          path: bench-results/*.json
          if-no-files-found: error

  b4-flake-probe:
    # Sonda de reproducibilidad: dos pruebas numéricas de B4 (multiescenario) fallaron de forma
    # intermitente en Linux en esta rama sin tocar su código. Se repiten sobre el commit de main de
    # B5.2 y sobre esta rama para separar un defecto previo de una regresión de B5.3.
    name: B4 multi-scenario flake probe (${{ matrix.label }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-b52
            ref: 539d4b7e37384921dfbfe2a51a3c52d809ba5517
          - label: b53-branch
            ref: ${{ github.sha }}
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,exact-mip]'
      - name: Repeat the two tests
        shell: bash
        run: |
          set +e
          echo "::notice title=probe-env::${{ matrix.label }} | $(git rev-parse --short HEAD) | $(python -m pip list 2>/dev/null | grep -i -E '^(numpy|scipy|clarabel|osqp) ' | tr '\n' ';' | sed 's/  */ /g') | $(lscpu | grep 'Model name' | sed 's/  */ /g')"
          passed=0; failed=0
          for i in $(seq 1 12); do
            python -m pytest -q -p no:cacheprovider "tests/unit/scenarios/test_multi_scenario.py::test_single_solutions_satisfy_the_constraints_of_every_scenario" "tests/unit/scenarios/test_multi_scenario.py::test_worst_case_maximizes_the_minimum_scenario_utility" > probe.txt 2>&1
            if [ $? -eq 0 ]; then passed=$((passed+1)); else failed=$((failed+1)); grep -E '^E  ' probe.txt | head -3 | while IFS= read -r line; do echo "::warning title=probe-error-${{ matrix.label }}::$line"; done; fi
          done
          echo "::notice title=probe-result::${{ matrix.label }} passed=$passed failed=$failed of 12"
