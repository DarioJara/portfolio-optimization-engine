[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-engine"
version = "0.1.0"
description = "Motor profesional de optimización cuantitativa de carteras multi-escenario (MASTER_SPEC.md)."
readme = "README.md"
requires-python = ">=3.11"
# Dependencias de runtime: núcleo numérico y lectura de datos (Bloque 1), OSQP (Bloque 2) y
# Clarabel (Bloque 4, backend cónico). PySCIPOpt (EXACT_MIP) es opcional: grupo ``exact-mip``.
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<4",
    "pyarrow>=14",
    "osqp>=1.1,<2",
    "clarabel>=0.11,<1",
    # Bloque 5.2: control de hilos BLAS/OpenMP por worker (PAR-007).
    "threadpoolctl>=3.5,<4",
]

[project.optional-dependencies]
# EXACT_MIP en modo validación (enmienda E-24): SCIP como backend de referencia; nunca obligatorio.
exact-mip = ["pyscipopt>=6"]
# Medición de memoria (RSS/USS/PSS) y carga del sistema en los benchmarks (B5.3, B5.5). Desde B5.5 los
# tests de metadatos y del harness de benchmarks importan los scripts, que la usan: instalar el extra
# `bench` junto a `dev` (la CI lo hace).
bench = ["psutil>=5.9"]
# Desarrollo y tests. Nunca se instalan globalmente: usar el entorno local .venv.
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    # Solo como implementación de referencia independiente en tests (Ledoit-Wolf).
    "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
include = ["portfolio_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: tests unitarios",
    "property: tests basados en propiedades (Hypothesis)",
    "architecture: reglas de arquitectura y gobierno",
    "integration: tests de integración de pipelines completos",
    "numerical_regression: regresión numérica frente a valores dorados",
    "performance: memoria y rendimiento (medidas descriptivas, sin umbrales de producción)",
]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["portfolio_engine"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "scipy.*", "sklearn.*", "osqp.*", "clarabel.*", "pyscipopt.*", "threadpoolctl.*", "psutil.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# Scripts de evidencia del auditor independiente (AUDIT_H1_FB551.md): se conservan tal cual, sin reformatear.
extend-exclude = ["evidence/audit_h1_fb551"]

[tool.ruff.format]
# Los informes de auditoría son evidencia histórica: el formateador de Markdown reescribiría sus
# bloques de código. Solo se excluyen del formateador; ``ruff check`` sigue activo sobre todo.
exclude = ["AUDIT_BLOCK_*.md", "AUDIT_H1_FB551.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "C90"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10
